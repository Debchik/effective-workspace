name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: Validate shell scripts
        run: bash -n scripts/bootstrap.sh scripts/start.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
